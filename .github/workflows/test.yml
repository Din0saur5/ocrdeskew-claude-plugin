name: Test shared helpers and Codex package

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pypdf
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_codex_plugin.py --out /tmp/ocrdeskew-codex-plugin.zip
